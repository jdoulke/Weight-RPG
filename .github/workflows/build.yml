name: Build

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spigot-version:
          - 26.1-R0.1-SNAPSHOT
          - 26.2-R0.1-SNAPSHOT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify -Dspigot.version=${{ matrix.spigot-version }}
